<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Leave your details</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#16261C;color:#ffffff}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 24px}
  h1{font-size:30px;font-weight:700;line-height:1.15;text-align:center;margin-bottom:20px}
  h1 em{font-style:normal;color:#D6A868}
  .card{background:#1F3D28;border:1px solid rgba(255,255,255,0.22);border-radius:20px;padding:20px}
  label{display:block;font-size:14px;margin:0 0 6px;color:rgba(255,255,255,0.9)}
  .field{margin-bottom:14px}
  input,textarea{width:100%;font-family:inherit;font-size:17px;color:#ffffff;background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.28);border-radius:12px;padding:13px 14px;outline:none}
  input:focus,textarea:focus{border-color:#D6A868}
  textarea{min-height:100px;resize:none}
  .btn{display:block;width:100%;margin-top:16px;font-family:inherit;font-size:18px;color:#ffffff;background:#C08B41;
    border:0;border-radius:40px;padding:15px;cursor:pointer}
  .btn:disabled{opacity:.6}
  .msg{text-align:center;font-size:15px;margin-top:12px;min-height:1px}
  .done{display:none;text-align:center;padding:44px 16px}
  .tick{width:72px;height:72px;line-height:72px;border-radius:50%;background:#C08B41;font-size:34px;margin:0 auto 16px}
  .done h2{font-size:28px;font-weight:700;margin-bottom:8px}
  .done h2 em{font-style:normal;color:#D6A868}
  .done p{font-size:16px;color:rgba(255,255,255,0.88)}
  .queue{text-align:center;font-size:13px;color:rgba(255,255,255,0.65);margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Leave your <em>details</em></h1>

  <form class="card" id="qc" novalidate>
    <div class="field">
      <label for="name">Name</label>
      <input id="name" autocomplete="name">
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input id="phone" type="tel" autocomplete="tel" inputmode="tel">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" inputmode="email">
    </div>
    <div class="field" style="margin-bottom:0">
      <label for="note">Notes</label>
      <textarea id="note" placeholder="Anything else to note?"></textarea>
    </div>
    <button class="btn" type="submit" id="go">Send it over</button>
    <p class="msg" id="msg"></p>
  </form>

  <div class="card done" id="done">
    <div class="tick">✓</div>
    <h2 id="doneTitle">Thank you, we've got your <em>details</em></h2>
    <p id="doneText">We'll be in touch soon.</p>
  </div>

  <p class="queue" id="queue"></p>
</div>

<script>
  // GHL inbound webhook for Expo 2026 - 02 leave your details form intake
  var WEBHOOK = 'https://services.leadconnectorhq.com/hooks/J378Bt0d7JvG2rXks3zo/webhook-trigger/KeGpikTZQTh2F3nA6eVH';
  var KEY = 'bsuk_stand_queue';
  var form = document.getElementById('qc');
  var done = document.getElementById('done');
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');
  var queueLine = document.getElementById('queue');
  var sending = false;

  // Offline queue: anything that fails to send is kept on this tablet and retried
  function readQueue(){
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ return []; }
  }
  function writeQueue(q){
    try { localStorage.setItem(KEY, JSON.stringify(q)); return true; } catch(e){ return false; }
  }
  function showQueue(){
    var n = readQueue().length;
    queueLine.textContent = n ? n + (n === 1 ? ' saved lead' : ' saved leads') + ' waiting to send, keep this page open' : '';
  }

  function post(data){
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 12000);
    return fetch(WEBHOOK, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(r){
      clearTimeout(timer);
      if(!r.ok) throw new Error('send failed');
    }, function(e){ clearTimeout(timer); throw e; });
  }

  function flush(){
    if(sending) return;
    var q = readQueue();
    if(!q.length){ showQueue(); return; }
    sending = true;
    var item = q[0];
    post(item.data).then(function(){
      var rest = readQueue().filter(function(x){ return x.id !== item.id; });
      writeQueue(rest);
      sending = false;
      showQueue();
      if(rest.length) flush();
    }).catch(function(){
      sending = false;
      showQueue();
    });
  }

  function reset(){
    form.reset();
    msg.textContent = '';
    done.style.display = 'none';
    form.style.display = 'block';
    go.disabled = false;
    window.scrollTo(0,0);
  }

  function thanks(saved){
    document.getElementById('doneTitle').innerHTML = saved ? 'Saved, we\'ve got your <em>details</em>' : 'Thank you, we\'ve got your <em>details</em>';
    document.getElementById('doneText').textContent = saved ? 'It will send as soon as the signal is back.' : 'We\'ll be in touch soon.';
    form.style.display = 'none';
    done.style.display = 'block';
    window.scrollTo(0,0);
    setTimeout(reset, 5000);
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('name').value.trim();
    var phone = document.getElementById('phone').value.trim();
    var email = document.getElementById('email').value.trim();
    var note = document.getElementById('note').value.trim();
    if(!phone && !email){
      msg.textContent = 'Pop in a phone number or email so we can get back to them.';
      return;
    }
    var parts = name.split(/\s+/);
    var data = {
      first_name: parts.shift() || '',
      last_name: parts.join(' '),
      email: email,
      phone: phone,
      message: note ? 'Note: ' + note : '',
      source: 'Expo stand quick capture',
      tag: 'expo stand quick capture',
      page: 'expo-stand'
    };
    go.disabled = true;
    msg.textContent = 'Sending...';
    post(data).then(function(){
      thanks(false);
    }).catch(function(){
      var q = readQueue();
      q.push({id: Date.now() + '_' + Math.random().toString(36).slice(2), data: data});
      if(writeQueue(q)){
        showQueue();
        thanks(true);
      } else {
        go.disabled = false;
        msg.textContent = 'That did not send. Check the signal and tap again.';
      }
    });
  });

  window.addEventListener('online', flush);
  setInterval(flush, 30000);
  showQueue();
  flush();
</script>
</body>
</html>
